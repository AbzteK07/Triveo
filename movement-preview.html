function loadDemo(k,button){const v=videoFor(k);if(!v)return;const frame=document.createElement("iframe");frame.className="demo-video";frame.title="Démonstration : "+E[k].n;frame.src="https://www.youtube-nocookie.com/embed/"+v.id+"?rel=0&playsinline=1&autoplay=1";frame.allow="autoplay; fullscreen; picture-in-picture";frame.referrerPolicy="strict-origin-when-cross-origin";frame.allowFullscreen=true;button.replaceWith(frame)}
function loadMovement(k,button,tutorial=false){
if(!REAL_CLIPS[k]||tutorial){loadDemo(k,button);return}
const section=button.closest(".real-movement"),status=section.querySelector(".movement-status"),actions=section.querySelector(".movement-actions");
const video=document.createElement("video");video.className="demo-video";video.controls=true;video.loop=true;video.muted=true;video.playsInline=true;video.preload="metadata";video.poster=REAL_CLIP_BASE+REAL_CLIPS[k]+".jpg";video.setAttribute("aria-label","Démonstration : "+E[k].n);
video.addEventListener("error",()=>{status.textContent="La vidéo ne peut pas être chargée. Utilise le tutoriel ou le lien de la source.";});
video.src=REAL_CLIP_BASE+REAL_CLIPS[k]+".mp4";button.replaceWith(video);if(actions)actions.hidden=false;const playing=video.play();if(playing&&playing.catch)playing.catch(()=>{status.textContent="Appuie sur lecture dans le lecteur pour démarrer.";});
}
function slowMovement(button){const video=button.closest(".real-movement").querySelector("video");if(!video)return;const slow=video.playbackRate===1;video.playbackRate=slow?0.5:1;button.setAttribute("aria-pressed",String(slow));button.textContent=slow?"Vitesse normale":"Ralenti ×0,5";}
function movementPanel(k,tutorial=false){
const clip=!!REAL_CLIPS[k]&&!tutorial,v=videoFor(k);if(!clip&&!v)return '<p class="mu">Démonstration momentanément indisponible.</p>';
const label=clip?"Clip court · boucle":"Tutoriel vidéo",publisher=clip?"YMove":v.publisher,url=clip?"https://ymove.app/free-exercise-videos":v.url;
return `<section class="real-movement"><div class="movement-head"><h3>Démonstration avec une vraie personne</h3><span class="movement-kind">${label}</span></div><div class="movement-stage"><button type="button" class="movement-launch" onclick="loadMovement('${k}',this,${tutorial})" aria-label="Voir le mouvement : ${esc(E[k].n)}"><span class="movement-play" aria-hidden="true">${I("play")}</span><strong>Voir le mouvement</strong><small>Lecture dans TRIVEO</small></button></div><div class="movement-info"><p class="mu movement-source">Source : <a href="${url}" target="_blank" rel="noopener noreferrer">${esc(publisher)}</a></p><span class="mu movement-source">Internet requis</span></div><p class="movement-note">${clip?"Clip court avec répétition du mouvement.":"Lecteur YouTube intégré · durée variable selon le tutoriel."}</p>${!clip&&v.note?`<p class="movement-note">${esc(v.note)}</p>`:""}<div class="movement-actions" hidden>${clip?'<button type="button" class="btn sec" aria-pressed="false" onclick="slowMovement(this)">Ralenti ×0,5</button>':""}</div><p class="mu movement-status" role="status"></p></section>`;
}
function realMovement(k){return movementPanel(k);}
function demo(k){const e=E[k],v=videoFor(k);return `<div class="card st">${realMovement(k)}<div class="demo-steps">${e.st.map((t,i)=>`<div class="demo-step"><b>${i+1}</b><p>${esc(t)}</p></div>`).join("")}</div>${v&&REAL_CLIPS[k]?`<details class="st"><summary>Tutoriel complémentaire</summary>${movementPanel(k,true)}</details>`:""}</div>`}
;
function renderList(){const q=document.getElementById("search").value.toLocaleLowerCase();document.getElementById("grid").innerHTML=Object.entries(E).filter(([k,e])=>e.n.toLocaleLowerCase().includes(q)).map(([k,e])=>`<article><h2>${esc(e.n)}</h2>${demo(k)}</article>`).join("")}document.getElementById("search").addEventListener("input",renderList);renderList();</script></body></html>
