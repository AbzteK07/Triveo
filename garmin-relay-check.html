<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRIVEO · Vérification du relais Garmin</title><style>body{background:#111b18;color:#f2f6ef;font:17px/1.6 system-ui;max-width:650px;margin:50px auto;padding:24px}button{padding:16px 22px;border:0;border-radius:12px;background:#b7ef60;font:inherit;cursor:pointer}a{color:#b7ef60}#state{background:#233329;padding:20px;border-radius:12px}</style><h1>Connexion Garmin de TRIVEO</h1><p>Ce test vérifie uniquement la communication avec le relais privé. Il n'accède ni à ta clé ni à tes données Garmin.</p><button id="test">Tester le relais privé</button><p id="state" role="status">Prêt pour le test.</p><p><a href="./">Retour à TRIVEO</a></p><script>
const origin="https://triveo-garmin-relay.abz-tek.chatgpt.site",button=document.getElementById("test"),state=document.getElementById("state");let popup,channel,timer;
window.addEventListener("message",e=>{if(e.origin===origin&&e.source===popup&&e.data?.channel===channel&&e.data.type==="triveo-garmin-ready"){clearTimeout(timer);state.textContent="Relais privé accessible : la communication avec TRIVEO fonctionne. Tu peux fermer la fenêtre du relais et revenir aux paramètres Garmin pour lancer ta synchronisation.";button.disabled=false;document.documentElement.dataset.relay="ready";}});
button.addEventListener("click",()=>{channel=crypto.randomUUID();popup=window.open(origin+"/#channel="+channel,"triveo-relay-test","popup,width=620,height=720");if(!popup){state.textContent="Fenêtre bloquée : autorise les fenêtres pour TRIVEO.";return}state.textContent="Connecte-toi au relais privé si une fenêtre le demande…";button.disabled=true;timer=setTimeout(()=>{state.textContent="Le relais n'a pas répondu. Vérifie la connexion ChatGPT et les fenêtres bloquées, puis réessaie.";button.disabled=false},180000);});
</script></html>
