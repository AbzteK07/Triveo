function xmlValue(node,tag){return node.getElementsByTagNameNS("*",tag)[0]?.textContent?.trim()||""}
async function importSportFile(inp){
 const f=inp.files?.[0];if(!f)return;
 const show=m=>{const x=$("#import-result");if(x)x.textContent=m};
 try{
 if(f.size>15e6)throw Error("Fichier trop volumineux (15 Mo maximum).");
 const doc=new DOMParser().parseFromString(await f.text(),"application/xml");
 if(doc.querySelector("parsererror"))throw Error("Fichier XML invalide.");
 const tcx=doc.documentElement.localName.toLowerCase()==="trainingcenterdatabase";
 const gpx=doc.documentElement.localName.toLowerCase()==="gpx";
 if(!tcx&&!gpx)throw Error("Utilise un fichier GPX ou TCX.");
 const rows=[];
 if(tcx){
  const acts=[...doc.getElementsByTagNameNS("*","Activity")];
  for(const a of acts){const sport=a.getAttribute("Sport")||"Other";
   const type=/run/i.test(sport)?"Course à pied":/bike|cycling/i.test(sport)?"Cyclisme":/swim/i.test(sport)?"Natation":null;
   if(!type)continue;
   const date=xmlValue(a,"Id").slice(0,10);
   const laps=[...a.getElementsByTagNameNS("*","Lap")];
   const seconds=laps.reduce((v,n)=>v+(Number(xmlValue(n,"TotalTimeSeconds"))||0),0);
   if(date&&seconds>0)rows.push({d:date,t:type,m:Math.max(1,Math.round(seconds/60)),source:"TCX"});
  }
 }else{
  const pts=[...doc.getElementsByTagNameNS("*","trkpt")];
  const times=pts.map(p=>Date.parse(xmlValue(p,"time"))).filter(Number.isFinite);
  if(times.length<2)throw Error("Ce GPX ne contient pas assez de points horodatés.");
  const min=Math.max(1,Math.round((Math.max(...times)-Math.min(...times))/60000));
  const name=xmlValue(doc,"name").toLowerCase();
  const type=/bik|cycl|vélo|velo/i.test(name)?"Cyclisme":/swim|nage|natation/i.test(name)?"Natation":"Course à pied";
  rows.push({d:new Date(Math.min(...times)).toISOString().slice(0,10),t:type,m:min,source:"GPX"});
 }
 let count=0;
 for(const a of rows){if(!D.act.some(x=>x.d===a.d&&x.t===a.t&&Math.abs(x.m-a.m)<=1)){D.act.push(a);count++}}
 if(count){sv();R()}
 alert(count+" activité(s) importée(s). "+(rows.length-count)+" doublon(s) ou activité(s) non admissible(s).");
 }catch(e){show("Import impossible : "+e.message)}finally{inp.value=""}
}
